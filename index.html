<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whunx Shop - Premium Cases</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* Современный дизайн в стиле топовых кейсов */
        :root {
            --bg-dark: #0a0a0c;
            --bg-card: #151518;
            --primary: #ff4500;
            --primary-glow: rgba(255, 69, 0, 0.4);
            --text-main: #ffffff;
            --text-muted: #888891;
            --gold: #ffd700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            background-image: radial-gradient(circle at 50% 0%, #1f1a24 0%, transparent 50%);
            min-height: 100vh;
        }

        /* Шапка */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
        }
        .logo span { color: var(--primary); }

        /* Авторизация и Баланс */
        .auth-zone {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .balance-box {
            display: none; /* Скрыто до авторизации */
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            color: var(--gold);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
        }

        .login-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--primary-glow);
        }

        /* Зона рулетки */
        .roulette-container {
            display: none; /* Показываем только при открытии */
            width: 100%;
            max-width: 1000px;
            margin: 40px auto;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .roulette-window {
            width: 100%;
            height: 180px;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            background: #0d0d0f;
        }

        /* Центральная линия */
        .roulette-window::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--gold);
            z-index: 10;
            box-shadow: 0 0 15px var(--gold);
            transform: translateX(-50%);
        }

        .roulette-tape {
            display: flex;
            height: 100%;
            transition: transform 6s cubic-bezier(0.1, 0, 0.1, 1);
            will-change: transform;
        }

        .item-card {
            min-width: 160px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.05) 100%);
            border-right: 1px solid rgba(255,255,255,0.05);
            padding: 10px;
        }

        .item-card img {
            width: 100px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        
        .item-rarity-red { border-bottom: 3px solid #eb4b4b; }
        .item-rarity-pink { border-bottom: 3px solid #d32ce6; }

        /* Витрина кейсов (сейчас 1 тестовый) */
        .cases-grid {
            display: flex;
            justify-content: center;
            padding: 80px 20px;
        }

        .case-card {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            width: 300px;
            transition: 0.3s;
            position: relative;
        }

        .case-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 69, 0, 0.5);
            box-shadow: 0 15px 40px var(--primary-glow);
        }

        .case-card img {
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }

        .case-name { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
        .case-price { color: var(--gold); font-size: 24px; font-weight: 900; margin-bottom: 20px; }
        
        .open-btn {
            width: 100%;
            padding: 15px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .open-btn:hover { background: #e0e0e0; }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="logo">WHUNX<span>.SHOP</span></div>
        <div class="auth-zone">
            <!-- Пока пользователь не вошел -->
            <button class="login-btn" id="loginBtn" onclick="mockLogin()">Войти через Google</button>
            
            <!-- Появляется после входа -->
            <div class="balance-box" id="balanceBox">
                <span id="balanceAmount">150</span> G
            </div>
        </div>
    </header>

    <!-- Рулетка (Скрыта по умолчанию) -->
    <div class="roulette-container" id="rouletteContainer">
        <div class="roulette-window">
            <div class="roulette-tape" id="rouletteTape">
                <!-- Айтемы сгенерируются через JS -->
            </div>
        </div>
    </div>

    <!-- Витрина (1 тестовый кейс) -->
    <div class="cases-grid">
        <div class="case-card">
            <img src="https://via.placeholder.com/150/222222/ff4500?text=TEST+CASE" alt="Test Case">
            <div class="case-name">TEST CASE</div>
            <div class="case-price">10 G</div>
            <button class="open-btn" onclick="startCaseOpening()">ОТКРЫТЬ КЕЙС</button>
        </div>
    </div>

    <script>
        let isLoggedIn = false;

        // Временная имитация авторизации (для визуала)
        function mockLogin() {
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('balanceBox').style.display = 'block';
            isLoggedIn = true;
        }

        // Логика рулетки, которая НИКОГДА не врет
        function startCaseOpening() {
            if (!isLoggedIn) {
                alert("Сначала войдите в аккаунт!");
                return;
            }

            const tape = document.getElementById('rouletteTape');
            const container = document.getElementById('rouletteContainer');
            
            // 1. Показываем рулетку и сбрасываем прошлую прокрутку
            container.style.display = 'block';
            tape.style.transition = 'none';
            tape.style.transform = 'translateX(0)';
            tape.innerHTML = ''; // очищаем ленту

            // 2. Имитируем запрос на сервер (Позже здесь будет fetch на твой Render-сервер)
            // Представим, что сервер УЖЕ решил, что мы выиграли этот предмет:
            const wonItemFromServer = {
                name: "M4A1 | Bubblegum",
                rarityClass: "item-rarity-pink",
                img: "https://via.placeholder.com/100/222222/d32ce6?text=M4A1"
            };

            // 3. Генерируем ленту. 
            // Чтобы рулетка крутилась красиво, нам нужно сгенерировать штук 80 предметов.
            // Но мы ЖЕСТКО ставим наш выигрышный предмет на 60-е место.
            const totalItems = 80;
            const winningIndex = 60;
            const itemWidth = 160; // ширина одной карточки

            for (let i = 0; i < totalItems; i++) {
                let div = document.createElement('div');
                div.className = 'item-card';

                if (i === winningIndex) {
                    // Ставим выигрышный предмет, который сказал сервер
                    div.classList.add(wonItemFromServer.rarityClass);
                    div.innerHTML = `<img src="${wonItemFromServer.img}"><b>${wonItemFromServer.name}</b>`;
                } else {
                    // Ставим фейковые красивые предметы просто для массовки в анимации
                    div.classList.add('item-rarity-red');
                    div.innerHTML = `<img src="https://via.placeholder.com/100/222222/eb4b4b?text=Trash"><b>Random</b>`;
                }
                tape.appendChild(div);
            }

            // 4. Запускаем саму анимацию прокрутки
            setTimeout(() => {
                // Включаем плавность
                tape.style.transition = 'transform 6s cubic-bezier(0.1, 0, 0.1, 1)';
                
                // Вычисляем, на сколько пикселей сдвинуть ленту, чтобы 60-й предмет стал ровно по центру.
                // Формула: (Индекс * Ширина предмета) - (Половина ширины экрана рулетки) + (Половина ширины предмета) + Рандомное смещение чтобы не ровно по центру линии стояло
                const containerWidth = document.querySelector('.roulette-window').clientWidth;
                const randomOffset = Math.floor(Math.random() * 60) - 30; // легкий сдвиг влево-вправо
                
                const distance = (winningIndex * itemWidth) - (containerWidth / 2) + (itemWidth / 2) + randomOffset;
                
                tape.style.transform = `translateX(-${distance}px)`;
            }, 50);

            // 5. После завершения анимации (через 6 секунд) показываем результат
            setTimeout(() => {
                alert(`Вы выбили: ${wonItemFromServer.name}`);
            }, 6200);
        }
    </script>
</body>
</html>
