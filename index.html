<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whunx Shop - Магазин игровой валюты</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =========================================
           GLOBAL VARIABLES & RESET
        ========================================= */
        :root {
            --bg-body: #0d0e15;
            --bg-header: #151722;
            --bg-card: #1a1c29;
            --bg-input: #222536;
            --accent-gold: #f4c745;
            --accent-blue: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #8b92a5;
            --transition: 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Manrope', sans-serif; user-select: none; }
        body { background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        button { font-family: inherit; cursor: pointer; border: none; outline: none; }
        
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        /* =========================================
           HEADER
        ========================================= */
        header { height: 80px; background: var(--bg-header); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: space-between; padding: 0 50px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .logo { font-size: 24px; font-weight: 900; letter-spacing: 0.5px; cursor: pointer; }
        .logo span { color: var(--accent-gold); }

        .header-right { display: flex; align-items: center; gap: 20px; }
        
        /* Баланс пользователя */
        .balance-module { display: none; align-items: center; background: var(--bg-input); border-radius: 12px; padding: 4px; border: 1px solid rgba(255,255,255,0.05); }
        .balance-amount { padding: 0 15px; font-size: 16px; font-weight: 800; color: #fff; }
        .balance-amount span { color: var(--text-muted); font-size: 14px; margin-left: 4px; }
        .balance-add-btn { width: 40px; height: 40px; background: var(--accent-blue); color: #fff; border-radius: 8px; display: flex; justify-content: center; align-items: center; transition: var(--transition); }
        .balance-add-btn:hover { filter: brightness(1.2); transform: scale(1.05); }

        .login-btn { background: #fff; color: #000; height: 48px; padding: 0 25px; border-radius: 12px; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 10px; transition: var(--transition); }
        .login-btn:hover { background: #e0e0e0; }

        /* Меню профиля */
        .profile-module { display: none; position: relative; }
        .profile-trigger { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px; border-radius: 12px; transition: 0.2s; }
        .profile-trigger:hover { background: rgba(255,255,255,0.05); }
        .profile-trigger img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; }
        
        .dropdown-menu { position: absolute; top: calc(100% + 15px); right: 0; width: 240px; background: var(--bg-header); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 15px; opacity: 0; visibility: hidden; transform: translateY(10px); transition: 0.2s; z-index: 200; box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
        .profile-module.active .dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-header { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .dropdown-name { font-size: 16px; font-weight: 800; color: #fff; }
        .dropdown-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; color: var(--text-muted); font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .dropdown-item:hover { background: rgba(255,255,255,0.05); color: #fff; }

        /* =========================================
           MAIN SHOP SECTION
        ========================================= */
        main { flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 60px 20px; }
        
        .shop-header { text-align: center; margin-bottom: 50px; }
        .shop-header h1 { font-size: 36px; font-weight: 900; margin-bottom: 10px; }
        .shop-header p { color: var(--text-muted); font-size: 16px; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; }
        
        .product-card { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 30px 20px; text-align: center; transition: var(--transition); position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        .product-card:hover { transform: translateY(-5px); border-color: rgba(244, 199, 69, 0.3); box-shadow: 0 15px 30px rgba(0,0,0,0.4); }
        
        .product-img { width: 120px; height: 120px; object-fit: contain; margin-bottom: 20px; filter: drop-shadow(0 10px 15px rgba(244,199,69,0.2)); }
        
        .product-gold { font-size: 24px; font-weight: 900; color: var(--accent-gold); margin-bottom: 5px; }
        .product-price { font-size: 16px; color: var(--text-muted); font-weight: 600; margin-bottom: 25px; }
        
        .btn-buy { width: 100%; background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.2); padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 800; transition: 0.2s; }
        .product-card:hover .btn-buy { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

        /* =========================================
           FOOTER (DONATE)
        ========================================= */
        footer { background: var(--bg-header); padding: 40px 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); margin-top: auto; }
        .btn-donate { background: transparent; color: var(--accent-gold); border: 1px solid var(--accent-gold); padding: 12px 30px; border-radius: 8px; font-size: 14px; font-weight: 800; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-donate:hover { background: rgba(244, 199, 69, 0.1); }

        /* =========================================
           MODALS (TOPUP & SETTINGS)
        ========================================= */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 1000; opacity: 0; transition: 0.3s; }
        .modal-box { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 40px; width: 100%; max-width: 450px; transform: scale(0.9); transition: 0.3s; position: relative; }
        .modal-close { position: absolute; top: 20px; right: 20px; background: transparent; color: var(--text-muted); font-size: 24px; transition: 0.2s; }
        .modal-close:hover { color: #fff; }
        
        .modal-title { font-size: 22px; font-weight: 900; margin-bottom: 25px; }

        .f-input-group { margin-bottom: 20px; text-align: left; }
        .f-input-label { display: block; font-size: 13px; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; }
        .f-input-wrapper { position: relative; }
        .f-input { width: 100%; background: var(--bg-input); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 15px; color: #fff; font-size: 16px; font-weight: 700; outline: none; transition: 0.2s; }
        .f-input:focus { border-color: var(--accent-blue); }
        .f-input-suffix { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-weight: 800; }

        .btn-submit { width: 100%; background: var(--accent-blue); color: #fff; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 800; transition: 0.2s; margin-top: 10px; }
        .btn-submit:hover { filter: brightness(1.1); }

        /* Кнопка привязки ТГ */
        .tg-bind-btn { background: rgba(36, 161, 222, 0.1); border: 1px solid rgba(36, 161, 222, 0.3); border-radius: 12px; padding: 15px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; }
        .tg-bind-btn:hover { background: rgba(36, 161, 222, 0.2); }
        .tg-info { display: flex; align-items: center; gap: 15px; color: #fff; font-weight: 700; }
        .tg-info i { font-size: 24px; color: #24A1DE; }

    </style>
</head>
<body>

    <!-- ШАПКА -->
    <header>
        <div class="logo">WHUNX<span>.SHOP</span></div>
        
        <div class="header-right">
            <button class="login-btn" id="loginBtn" onclick="loginWithGoogle()"><i class="fa-brands fa-google" style="color:#DB4437;"></i> Войти</button>
            
            <div class="balance-module" id="balanceModule">
                <div class="balance-amount" id="balanceText">0 <span>₽</span></div>
                <button class="balance-add-btn" onclick="openModal('topupModal')"><i class="fa-solid fa-plus"></i></button>
            </div>
            
            <div class="profile-module" id="profileModule">
                <div class="profile-trigger" onclick="toggleDropdown()">
                    <img id="headerAvatar" src="whunx_pp.png" alt="Avatar">
                </div>
                
                <div class="dropdown-menu" id="profileDropdown">
                    <div class="dropdown-header">
                        <!-- ID ЗДЕСЬ БОЛЬШЕ НЕ ОТОБРАЖАЕТСЯ -->
                        <div class="dropdown-name" id="dropdownName">Player</div>
                    </div>
                    <div class="dropdown-item" onclick="openModal('settingsModal')"><i class="fa-solid fa-gear"></i> Настройки</div>
                    <div class="dropdown-item" onclick="openModal('topupModal')"><i class="fa-solid fa-wallet"></i> Пополнить баланс</div>
                    <div class="dropdown-item logout" onclick="logout()" style="color: var(--accent-red);"><i class="fa-solid fa-arrow-right-from-bracket"></i> Выйти</div>
                </div>
            </div>
        </div>
    </header>

    <!-- ГЛАВНАЯ: МАГАЗИН -->
    <main>
        <div class="shop-header">
            <h1>Покупка игровой валюты</h1>
            <p>Моментальное почисление на ваш аккаунт</p>
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- Сетка товаров генерируется через JS -->
        </div>
    </main>

    <!-- ФУТЕР -->
    <footer>
        <button class="btn-donate" onclick="alert('Спасибо за поддержку! Реквизиты скоро будут добавлены.')">
            <i class="fa-solid fa-heart"></i> Пожертвовать проекту
        </button>
    </footer>

    <!-- МОДАЛКА: ПОПОЛНЕНИЕ БАЛАНСА -->
    <div class="modal-overlay" id="topupModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal('topupModal')"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-title">Пополнить баланс</div>
            
            <div class="f-input-group">
                <label class="f-input-label">Сумма пополнения (Минимум 10 ₽)</label>
                <div class="f-input-wrapper">
                    <input type="number" id="topupAmountInput" class="f-input" placeholder="100">
                    <span class="f-input-suffix">₽</span>
                </div>
            </div>
            
            <button class="btn-submit" onclick="processTopup()">Перейти к оплате</button>
        </div>
    </div>

    <!-- МОДАЛКА: НАСТРОЙКИ (ПРИВЯЗКА ТГ) -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal('settingsModal')"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-title">Настройки аккаунта</div>
            
            <div class="tg-bind-btn" onclick="alert('Бот авторизации Telegram в разработке.')">
                <div class="tg-info">
                    <i class="fa-brands fa-telegram"></i>
                    <span>Привязать Telegram</span>
                </div>
                <i class="fa-solid fa-link" style="color: var(--text-muted);"></i>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // Инициализация Supabase
        const SUPABASE_URL = 'https://xnpbbmyttexqmtbtybjg.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhucGJibXl0dGV4cW10YnR5YmpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2OTc4NDcsImV4cCI6MjEwMjI3Mzg0N30.7x3UDegy7zCeT88-2Fps-uF2nMR-PDAnnXcLt5we0zw';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentDbUser = null; 

        // База товаров магазина
        const shopItems = [
            { id: 1, gold: 100, price: 100, img: 'https://wiki.standoff2.com/images/thumb/8/85/Gold_1.png/300px-Gold_1.png' },
            { id: 2, gold: 500, price: 480, img: 'https://wiki.standoff2.com/images/thumb/7/75/Gold_2.png/300px-Gold_2.png' },
            { id: 3, gold: 1000, price: 900, img: 'https://wiki.standoff2.com/images/thumb/b/b5/Gold_3.png/300px-Gold_3.png' },
            { id: 4, gold: 3000, price: 2200, img: 'https://wiki.standoff2.com/images/thumb/2/22/Gold_4.png/300px-Gold_4.png' }
        ];

        // Запрет скролла на инпутах
        document.addEventListener("wheel", function(event){
            if(document.activeElement.type === "number") document.activeElement.blur();
        });

        window.addEventListener('DOMContentLoaded', async () => {
            renderShop();
            
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) handleUserLogin(session.user);

            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' && session) handleUserLogin(session.user);
                else if (event === 'SIGNED_OUT') handleUserLogout();
            });
        });

        async function loginWithGoogle() {
            await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } });
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            document.getElementById('profileDropdown').classList.remove('active');
        }

        async function handleUserLogin(userAuth) {
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('balanceModule').style.display = 'flex';
            document.getElementById('profileModule').style.display = 'block';

            let { data: dbUser, error } = await supabaseClient.from('users').select('*').eq('email', userAuth.email).single();
            if (!dbUser) {
                let defaultName = userAuth.user_metadata.full_name;
                if (!defaultName || defaultName.trim() === '') {
                    defaultName = 'whunx-user-' + Math.random().toString(36).substring(2, 8).toLowerCase();
                }
                
                const newUser = { 
                    email: userAuth.email, 
                    username: defaultName, 
                    avatar_url: 'whunx_pp.png', 
                    balance: 0, 
                    secret_id: crypto.randomUUID() // ГЕНЕРАЦИЯ СЕКРЕТНОГО ID (НИГДЕ НЕ ВЫВОДИТСЯ)
                };
                const { data: insertedUser, err } = await supabaseClient.from('users').insert([newUser]).select().single();
                if(!err) dbUser = insertedUser;
            }

            currentDbUser = dbUser;
            updateUI();
        }

        function handleUserLogout() {
            currentDbUser = null;
            document.getElementById('loginBtn').style.display = 'flex';
            document.getElementById('balanceModule').style.display = 'none';
            document.getElementById('profileModule').style.display = 'none';
        }

        function updateUI() {
            if(!currentDbUser) return;
            document.getElementById('balanceText').innerHTML = `${currentDbUser.balance} <span>₽</span>`;
            document.getElementById('dropdownName').innerText = currentDbUser.username;
        }

        // --- РЕНДЕР МАГАЗИНА ---
        function renderShop() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            shopItems.forEach(item => {
                const card = document.createElement('div'); 
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${item.img}" class="product-img" alt="Gold">
                    <div class="product-gold">${item.gold} G</div>
                    <div class="product-price">${item.price} ₽</div>
                    <button class="btn-buy" onclick="attemptPurchase(${item.id})">Купить</button>
                `;
                grid.appendChild(card);
            });
        }

        // --- ЛОГИКА ПОКУПКИ ---
        function attemptPurchase(itemId) {
            if (!currentDbUser) {
                alert('Для совершения покупок необходимо войти в аккаунт.');
                return;
            }

            const item = shopItems.find(i => i.id === itemId);
            if (!item) return;

            if (currentDbUser.balance >= item.price) {
                // Денег хватает - покупаем
                if(confirm(`Списать ${item.price} ₽ за ${item.gold} G?`)) {
                    executePurchase(item);
                }
            } else {
                // Денег не хватает - предлагаем пополнить
                openModal('topupModal');
                document.getElementById('topupAmountInput').value = item.price; // Сразу подставляем нужную сумму
            }
        }

        async function executePurchase(item) {
            currentDbUser.balance -= item.price;
            document.getElementById('balanceText').innerHTML = `${currentDbUser.balance} <span>₽</span>`;
            
            // Сохраняем в БД списание рублей
            await supabaseClient.from('users').update({ balance: currentDbUser.balance }).eq('email', currentDbUser.email);
            
            alert(`Успешная покупка! На ваш аккаунт зачислено ${item.gold} G.`);
            // Здесь в будущем можно отправлять запрос на сервер для начисления голды по API
        }

        // --- ЛОГИКА ПОПОЛНЕНИЯ ---
        async function processTopup() {
            const amount = parseFloat(document.getElementById('topupAmountInput').value);
            if (!amount || amount < 10) {
                alert('Минимальная сумма пополнения 10 ₽');
                return;
            }

            // ИМИТАЦИЯ УСПЕШНОГО ПЛАТЕЖА (ШЛЮЗ)
            closeModal('topupModal');
            alert(`Переход на страницу оплаты ${amount} ₽...`);
            
            // Для теста зачислим деньги сразу
            setTimeout(async () => {
                currentDbUser.balance += amount;
                updateUI();
                await supabaseClient.from('users').update({ balance: currentDbUser.balance }).eq('email', currentDbUser.email);
                alert(`Баланс успешно пополнен на ${amount} ₽!`);
            }, 1000);
        }

        // --- UI ФУНКЦИИ ---
        function toggleDropdown() { 
            document.getElementById('profileModule').classList.toggle('active'); 
        }
        
        document.addEventListener('click', (e) => { 
            const module = document.getElementById('profileModule'); 
            if (module.classList.contains('active') && !module.contains(e.target)) module.classList.remove('active'); 
        });

        function openModal(id) { 
            document.getElementById('profileDropdown').classList.remove('active'); 
            const modal = document.getElementById(id); 
            modal.style.display = 'flex'; 
            setTimeout(() => { modal.style.opacity = '1'; modal.querySelector('.modal-box').style.transform = 'scale(1)'; }, 10); 
        }
        
        function closeModal(id) { 
            const modal = document.getElementById(id); 
            modal.style.opacity = '0'; 
            modal.querySelector('.modal-box').style.transform = 'scale(0.9)'; 
            setTimeout(() => { modal.style.display = 'none'; }, 300); 
        }
    </script>
</body>
</html>
