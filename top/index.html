<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Whunx Shop - Зал Славы</title>
    
    <link rel="icon" type="image/png" href="https://whunx.shop/whunx_icon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        /* =========================================
           GLOBAL VARIABLES & RESET
        ========================================= */
        :root {
            --bg-body: #08090d;
            --bg-input: rgba(30, 34, 48, 0.6);
            --accent-gold: #f4c745; 
            --accent-gold-glow: rgba(244, 199, 69, 0.4);
            --accent-purple: #8b5cf6; 
            --accent-purple-glow: rgba(139, 92, 246, 0.4);
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #ffffff;
            --text-muted: #a3a8b5;
            --glass-border: rgba(255, 255, 255, 0.08);
            --transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        .bg-orb { position: fixed; border-radius: 50%; filter: blur(140px); z-index: -2; pointer-events: none; opacity: 0.35; animation: floatOrb 20s infinite ease-in-out alternate; }
        .orb-1 { width: 500px; height: 500px; background: var(--accent-purple); top: -10%; left: -10%; }
        .orb-2 { width: 600px; height: 600px; background: var(--accent-gold); bottom: -20%; right: -10%; animation-delay: -5s; opacity: 0.15;}
        @keyframes floatOrb { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(60px, 60px) scale(1.1); } }

        body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px); background-size: 40px 40px; mask-image: radial-gradient(ellipse at center, black 60%, transparent 100%); }
        button { cursor: pointer; border: none; outline: none; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        /* =========================================
           HEADER & SIDEBAR
        ========================================= */
        header { height: 80px; background: rgba(10, 12, 16, 0.6); backdrop-filter: blur(40px); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between; padding: 0 50px; position: sticky; top: 0; z-index: 100; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
        .header-left { display: flex; align-items: center; gap: 25px; }
        .burger-btn { width: 45px; height: 45px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); display: flex; justify-content: center; align-items: center; font-size: 1.2rem; color: #fff; cursor: pointer; transition: var(--transition); }
        .burger-btn:hover { background: rgba(139, 92, 246, 0.15); border-color: var(--accent-purple); color: var(--accent-purple); box-shadow: 0 0 20px var(--accent-purple-glow); }
        .logo { font-size: 26px; font-weight: 900; letter-spacing: 1px; cursor: pointer; color: #fff; text-transform: uppercase; text-decoration: none;} 
        .logo span { color: var(--accent-purple); text-shadow: 0 0 20px var(--accent-purple-glow); }
        
        .sidebar-menu { position: fixed; top: 0; left: -100vw; width: 320px; height: 100vh; background: rgba(10, 12, 18, 0.95); backdrop-filter: blur(35px); border-right: 1px solid var(--glass-border); z-index: 1000; transition: left 0.4s; padding: 40px 25px; box-shadow: 20px 0 60px rgba(0,0,0,0.7); display: flex; flex-direction: column; }
        .sidebar-menu.active { left: 0 !important; }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 999; display: none; opacity: 0; transition: opacity 0.4s; }
        .sidebar-overlay.active { display: block; opacity: 1; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--glass-border); }
        .sidebar-header h2 { font-size: 1.2rem; font-weight: 900; color: #fff; text-transform: uppercase; }
        .sidebar-close { color: var(--text-muted); font-size: 1.5rem; cursor: pointer; transition: 0.3s; }
        .sidebar-close:hover { color: var(--accent-red); transform: rotate(90deg); }
        .sidebar-link { display: flex; align-items: center; gap: 15px; padding: 16px 20px; border-radius: 14px; text-decoration: none; color: var(--text-muted); font-weight: 700; font-size: 0.95rem; transition: 0.3s; text-transform: uppercase; }
        .sidebar-link i { font-size: 1.2rem; width: 25px; text-align: center; color: var(--accent-purple); }
        .sidebar-link:hover { background: rgba(255,255,255,0.03); color: #fff; transform: translateX(5px); }
        .sidebar-link.active { background: rgba(244, 199, 69, 0.1); border: 1px solid rgba(244, 199, 69, 0.3); color: var(--accent-gold); box-shadow: 0 5px 15px var(--accent-gold-glow);}
        .sidebar-link.active i { color: var(--accent-gold); }

        .header-right { display: flex; align-items: center; gap: 20px; }
        .custom-google-wrapper { position: relative; display: inline-block; cursor: pointer; border-radius: 14px; }
        .login-btn { background: #fff; color: #000; height: 48px; min-width: 150px; padding: 0 25px; border-radius: 14px; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; transition: var(--transition); text-transform: uppercase;} 
        .invisible-google-btn { position: absolute; inset: -10px; opacity: 0.01; z-index: 50; }
        
        .balance-module { display: none; align-items: center; background: rgba(0,0,0,0.4); border-radius: 14px; padding: 5px; border: 1px solid var(--glass-border); }
        .balance-amount { padding: 0 15px; font-size: 16px; font-weight: 800; color: #fff; display: flex; gap: 4px; } 
        .balance-amount span { color: var(--text-muted); font-size: 14px; }
        .balance-add-btn { width: 40px; height: 40px; background: var(--accent-purple); color: #fff; border-radius: 10px; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 15px var(--accent-purple-glow); }
        
        .profile-module { display: none; position: relative; }
        .profile-trigger { display: flex; align-items: center; cursor: pointer; padding: 5px; border-radius: 14px; } 
        .profile-trigger img { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; border: 1px solid var(--glass-border); }

        /* =========================================
           TOP PAGE STYLES
        ========================================= */
        main { flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 60px 20px; z-index: 10; position: relative; }
        .page-header { text-align: center; margin-bottom: 60px; } 
        .page-header h1 { font-size: 38px; font-weight: 900; margin-bottom: 15px; background: linear-gradient(to right, #ffffff, #a3a8b5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 2px;} 
        .page-header p { color: var(--text-muted); font-size: 16px; font-weight: 600;}

        .tops-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }

        .top-card {
            background: linear-gradient(145deg, rgba(30, 34, 48, 0.3) 0%, rgba(15, 18, 26, 0.6) 100%); 
            backdrop-filter: blur(25px); 
            border: 1px solid var(--glass-border); 
            border-top: 4px solid var(--glass-border);
            border-radius: 24px; 
            padding: 30px 25px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            animation: fadeInUp 0.5s ease forwards;
        }

        /* Цвета бордеров для карточек */
        .card-donators { border-top-color: var(--accent-gold); }
        .card-withdrawals { border-top-color: var(--accent-purple); }
        .card-ideas { border-top-color: var(--accent-green); }

        .top-card-title { font-size: 20px; font-weight: 900; text-transform: uppercase; margin-bottom: 25px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }

        .top-list { display: flex; flex-direction: column; gap: 15px; }
        
        .top-item { display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); padding: 15px; border-radius: 16px; transition: 0.3s; }
        .top-item:hover { background: rgba(0,0,0,0.5); transform: translateX(5px); }

        .rank-number { font-size: 20px; font-weight: 900; width: 30px; text-align: center; }
        .rank-1 { color: #f4c745; text-shadow: 0 0 15px rgba(244,199,69,0.5); font-size: 24px;}
        .rank-2 { color: #cbd5e1; text-shadow: 0 0 15px rgba(203,213,225,0.4); font-size: 22px;}
        .rank-3 { color: #d97706; text-shadow: 0 0 15px rgba(217,119,6,0.4); }

        .top-avatar { width: 45px; height: 45px; border-radius: 14px; object-fit: cover; border: 1px solid var(--glass-border); }
        .top-info { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0;}
        .top-name { font-weight: 800; font-size: 15px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .top-value { font-weight: 900; font-size: 14px; }
        .top-desc { font-size: 11px; color: var(--text-muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Цвета значений */
        .val-gold { color: var(--accent-gold); text-shadow: 0 0 10px var(--accent-gold-glow); }
        .val-purple { color: var(--accent-purple); text-shadow: 0 0 10px var(--accent-purple-glow); }
        .val-green { color: var(--accent-green); text-shadow: 0 0 10px rgba(16,185,129,0.4); }

        .empty-state { text-align: center; color: var(--text-muted); font-size: 13px; font-weight: 600; padding: 20px 0; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            header { padding: 0 15px; height: 70px; }
            .logo { font-size: 20px; }
            .header-left { gap: 10px; }
            .header-right { gap: 10px; }
            .burger-btn { width: 40px; height: 40px; font-size: 1.1rem; }
            main { padding: 30px 15px; }
            .page-header h1 { font-size: 28px; }
            .top-card { padding: 25px 20px; }
        }
        @media (max-width: 400px) {
            .logo span { display: none; }
            .login-btn { min-width: 100px; padding: 0 15px; font-size: 12px;}
        }
    </style>
</head>
<body>

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="sidebar-menu" id="sidebarMenu">
        <div class="sidebar-header">
            <h2>Навигация</h2>
            <i class="fa-solid fa-xmark sidebar-close" onclick="toggleSidebar()"></i>
        </div>
        <div class="sidebar-nav">
            <a href="https://whunx.shop/" class="sidebar-link"><i class="fa-solid fa-store"></i> Магазин голды</a>
            <a href="https://whunx.shop/comment" class="sidebar-link"><i class="fa-solid fa-star"></i> Отзывы клиентов</a>
            <a href="https://whunx.shop/idea" class="sidebar-link"><i class="fa-solid fa-lightbulb"></i> Предложить идею</a>
            <a href="https://whunx.shop/top" class="sidebar-link active"><i class="fa-solid fa-trophy"></i> Зал Славы</a>
        </div>
    </div>

    <header>
        <div class="header-left">
            <div class="burger-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></div>
            <a href="https://whunx.shop/" class="logo">WHUNX<span>.SHOP</span></a>
        </div>
        <div class="header-right">
            <div id="googleLoginWrapper" class="custom-google-wrapper">
                <button class="login-btn">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" style="width: 20px;"> 
                    <span id="fakeGoogleText"><i class="fa-solid fa-circle-notch fa-spin"></i></span>
                </button>
                <div id="googleLoginBtn" class="invisible-google-btn"></div>
            </div>

            <div class="balance-module" id="balanceModule">
                <div class="balance-amount" id="balanceText">0 <span>₸</span></div>
                <button class="balance-add-btn" onclick="window.location.href='https://whunx.shop/'"><i class="fa-solid fa-wallet"></i></button>
            </div>
            <div class="profile-module" id="profileModule">
                <div class="profile-trigger" onclick="window.location.href='https://whunx.shop/'" title="Вернуться в профиль на главную">
                    <img id="headerAvatar" src="https://whunx.shop/whunx_pp.png" alt="Avatar">
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="page-header">
            <h1>Зал Славы</h1>
            <p>Топ пользователей, которые вносят наибольший вклад в проект</p>
        </div>

        <div class="tops-grid">
            
            <!-- ТОП ДОНАТЕРОВ -->
            <div class="top-card card-donators">
                <h3 class="top-card-title"><i class="fa-solid fa-gem" style="color: var(--accent-gold);"></i> Топ Донатеров</h3>
                <div class="top-list" id="donatorsList">
                    <div class="empty-state"><i class="fa-solid fa-circle-notch fa-spin"></i> Загрузка...</div>
                </div>
            </div>

            <!-- ТОП ВЫВОДОВ -->
            <div class="top-card card-withdrawals">
                <h3 class="top-card-title"><i class="fa-solid fa-crown" style="color: var(--accent-purple);"></i> Крупнейшие Выводы</h3>
                <div class="top-list" id="withdrawalsList">
                    <div class="empty-state"><i class="fa-solid fa-circle-notch fa-spin"></i> Загрузка...</div>
                </div>
            </div>

            <!-- ТОП ИДЕЙ -->
            <div class="top-card card-ideas">
                <h3 class="top-card-title"><i class="fa-solid fa-lightbulb" style="color: var(--accent-green);"></i> Лучшие Идеи</h3>
                <div class="top-list" id="ideasList">
                    <div class="empty-state"><i class="fa-solid fa-circle-notch fa-spin"></i> Загрузка...</div>
                </div>
            </div>

        </div>
    </main>

    <script>
        const GOOGLE_CLIENT_ID = '259244951144-dc5hm679lgjkfa21k5g7hgr9i3lj2e51.apps.googleusercontent.com';
        const SUPABASE_URL = 'https://xnpbbmyttexqmtbtybjg.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhucGJibXl0dGV4cW10YnR5YmpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2OTc4NDcsImV4cCI6MjEwMjI3Mzg0N30.7x3UDegy7zCeT88-2Fps-uF2nMR-PDAnnXcLt5we0zw';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentSessionToken = null;
        let isLoggingIn = false;

        function toggleSidebar() {
            document.getElementById('sidebarMenu').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        window.addEventListener('DOMContentLoaded', async () => {
            loadTops(); // Загружаем топы

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) handleUserLogin(session);
            else initGoogleAuth();

            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' && session) handleUserLogin(session);
                else if (event === 'SIGNED_OUT') handleUserLogout();
            });
        });

        function initGoogleAuth() {
            const btn = document.getElementById("googleLoginBtn");
            if (currentSessionToken) return;
            if (window.google && window.google.accounts && btn) {
                try {
                    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleLogin });
                    google.accounts.id.renderButton(btn, { theme: "outline", size: "large", type: "standard", width: 250 });
                    document.getElementById('fakeGoogleText').innerText = 'Войти';
                } catch (e) { document.getElementById('fakeGoogleText').innerText = 'Ошибка'; }
            } else { setTimeout(initGoogleAuth, 100); }
        }

        async function handleGoogleLogin(response) {
            const { data, error } = await supabaseClient.auth.signInWithIdToken({ provider: 'google', token: response.credential });
            if (!error) handleUserLogin(data.session);
        }

        async function handleUserLogin(session) {
            if (isLoggingIn) return;
            isLoggingIn = true;
            try {
                currentSessionToken = session.access_token;
                document.getElementById('googleLoginWrapper').style.display = 'none';
                document.getElementById('balanceModule').style.display = 'flex';
                document.getElementById('profileModule').style.display = 'block';

                const { data: usersData } = await supabaseClient.from('users').select('*').eq('email', session.user.email).limit(1);
                if (usersData && usersData.length > 0) {
                    const dbUser = usersData[0];
                    document.getElementById('balanceText').innerHTML = `${dbUser.balance} <span>₸</span>`;
                    document.getElementById('headerAvatar').src = dbUser.avatar_url.startsWith('http') || dbUser.avatar_url.startsWith('data') ? dbUser.avatar_url : `https://whunx.shop/${dbUser.avatar_url}`;
                }
            } catch (err) {} finally { isLoggingIn = false; }
        }

        function handleUserLogout() {
            currentSessionToken = null;
            document.getElementById('googleLoginWrapper').style.display = 'inline-block';
            document.getElementById('balanceModule').style.display = 'none';
            document.getElementById('profileModule').style.display = 'none';
            initGoogleAuth();
        }

        // ==========================================
        // ЛОГИКА ЗАГРУЗКИ ТОПОВ
        // ==========================================
        function getSafeAvatar(url) {
            if (!url) return 'https://whunx.shop/whunx_pp.png';
            if (url.startsWith('http') || url.startsWith('data:')) return url;
            if (url.startsWith('/')) return 'https://whunx.shop' + url;
            return 'https://whunx.shop/' + url;
        }

        function getRankIcon(rank) {
            if (rank === 1) return '<i class="fa-solid fa-trophy"></i>';
            return rank;
        }

        async function loadTops() {
            try {
                // Параллельный запрос к 3м функциям базы
                const [donators, withdrawals, ideas] = await Promise.all([
                    supabaseClient.rpc('get_top_donators'),
                    supabaseClient.rpc('get_top_withdrawals'),
                    supabaseClient.rpc('get_top_ideas')
                ]);

                // 1. Рендер Донатеров
                const dList = document.getElementById('donatorsList');
                if (donators.data && donators.data.length > 0) {
                    dList.innerHTML = donators.data.map((item, index) => `
                        <div class="top-item">
                            <div class="rank-number rank-${index + 1}">${getRankIcon(index + 1)}</div>
                            <img src="${getSafeAvatar(item.avatar_url)}" class="top-avatar">
                            <div class="top-info">
                                <div class="top-name">${item.username}</div>
                                <div class="top-value val-gold">${item.total_donated} ₸</div>
                            </div>
                        </div>
                    `).join('');
                } else { dList.innerHTML = '<div class="empty-state">Нет данных</div>'; }

                // 2. Рендер Выводов
                const wList = document.getElementById('withdrawalsList');
                if (withdrawals.data && withdrawals.data.length > 0) {
                    wList.innerHTML = withdrawals.data.map((item, index) => `
                        <div class="top-item">
                            <div class="rank-number rank-${index + 1}">${getRankIcon(index + 1)}</div>
                            <img src="${getSafeAvatar(item.avatar_url)}" class="top-avatar">
                            <div class="top-info">
                                <div class="top-name">${item.username}</div>
                                <div class="top-value val-purple">${item.gold_amount} G</div>
                            </div>
                        </div>
                    `).join('');
                } else { wList.innerHTML = '<div class="empty-state">Нет данных</div>'; }

                // 3. Рендер Идей
                const iList = document.getElementById('ideasList');
                if (ideas.data && ideas.data.length > 0) {
                    iList.innerHTML = ideas.data.map((item, index) => `
                        <div class="top-item">
                            <div class="rank-number rank-${index + 1}">${getRankIcon(index + 1)}</div>
                            <img src="${getSafeAvatar(item.avatar_url)}" class="top-avatar">
                            <div class="top-info">
                                <div class="top-name">${item.username}</div>
                                <div class="top-value val-green">+${item.reward_amount} ₸ награда</div>
                                <div class="top-desc">"${item.idea_text}"</div>
                            </div>
                        </div>
                    `).join('');
                } else { iList.innerHTML = '<div class="empty-state">Нет данных</div>'; }

            } catch(e) {
                console.error(e);
                document.querySelectorAll('.top-list').forEach(el => el.innerHTML = '<div class="empty-state" style="color: var(--accent-red);">Ошибка загрузки</div>');
            }
        }
    </script>
</body>
</html>
